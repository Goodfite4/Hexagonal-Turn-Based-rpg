<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Teams</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="Game">
    <div id="turn-order-ui"></div>

    <div id="full-window">
      <canvas id="canvas" width="1600" height="900"></canvas>

      <div id="sidebar">
        <div id="chat-info" class="scrollable"></div>
          <div id="chat-input">
            <input type="text" id="chat-box" placeholder="Enter command..." />
            <button onclick="sendMessage()">Send</button>
        </div>
      </div>

    <div id="action-banner-ui">
      <div id="ability-banner">
        <img id="char-portrait" src="" />
        
        <img class="ap-icon" src="Images/UI/ActionPT.png" />
        <img class="ap-icon" src="Images/UI/ActionPT.png" />

        <img class="ability-icon" id="ability-1" src="" />
        <img class="ability-icon" id="ability-2" src="" />
        <img class="ability-icon" id="ability-3" src="" />
        <img class="ability-icon" id="ability-4" src="" />

        <img id="movement-speed-icon" src="Images/UI/MS.png" />
      </div>
    </div>

    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
